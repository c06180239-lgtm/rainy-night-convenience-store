<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>雨夜便利店 · 微缩街角模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 45%, #161a30 0%, #0a0c18 55%, #05060d 100%);
    overflow: hidden;
    cursor: grab;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  }
  body:active { cursor: grabbing; }
  #canvas-container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }
  /* 悬停信息提示 */
  #tooltip {
    position: fixed;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.1s ease;
    background: rgba(10, 12, 24, 0.78);
    color: #f0f0f5;
    padding: 8px 16px;
    font-size: 12px;
    border-radius: 6px;
    z-index: 20;
    transform: translate(14px, 14px);
    backdrop-filter: blur(6px);
    letter-spacing: 1px;
    border: 1px solid rgba(255,255,255,0.08);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ==================================================
// 1. 场景基础与相机控制
// ==================================================
const container = document.getElementById('canvas-container');
const tooltip = document.getElementById('tooltip');
const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.FogExp2(0x0a0c18, 0.03);

// 相机：构图紧凑，便利店为视觉中心，底座完整可见
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.0, 4.8, 7.0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// 后期处理：克制高级泛光，仅高亮区域发光
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.22,   // 泛光强度
  0.6,    // 泛光半径
  0.88    // 泛光阈值
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// 轨道控制器：丝滑专业手感
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.rotateSpeed = 0.68;
controls.zoomSpeed = 0.85;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2.08;
controls.minPolarAngle = Math.PI / 5.5;
controls.target.set(0, 1.0, -1.5);

// ==================================================
// 2. 写实材质库（自然高级质感，统一风格）
// ==================================================
const Materials = {
  // 建筑外墙：真实哑光涂料，微颗粒质感
  wall: new THREE.MeshStandardMaterial({
    color: 0xe8e2d4,
    roughness: 0.88,
    metalness: 0.02
  }),
  // 外墙腰线/装饰：同色系稍深
  wallTrim: new THREE.MeshStandardMaterial({
    color: 0xd8d2c4,
    roughness: 0.82,
    metalness: 0.03
  }),
  // 深色建筑结构：屋顶、雨棚
  buildingDark: new THREE.MeshStandardMaterial({
    color: 0x2d3a55,
    roughness: 0.78,
    metalness: 0.12
  }),
  // 沥青路面：湿润质感
  asphalt: new THREE.MeshStandardMaterial({
    color: 0x191b25,
    roughness: 0.9,
    metalness: 0.04
  }),
  // 人行道地砖
  sidewalk: new THREE.MeshStandardMaterial({
    color: 0x3b3e4f,
    roughness: 0.92,
    metalness: 0.03
  }),
  // 金属窗框/灯杆：拉丝哑光金属
  metalFrame: new THREE.MeshStandardMaterial({
    color: 0x5a5d6c,
    roughness: 0.32,
    metalness: 0.75
  }),
  // 橱窗玻璃：高透射真实玻璃，带轻微环境反射
  glass: new THREE.MeshPhysicalMaterial({
    color: 0xc8e0ff,
    transparent: true,
    opacity: 0.28,
    roughness: 0.04,
    metalness: 0.02,
    transmission: 0.92,
    ior: 1.5,
    thickness: 0.06,
    clearcoat: 0.9,
    clearcoatRoughness: 0.08,
    emissive: 0xffe8cc,
    emissiveIntensity: 0.08
  }),
  // 冷柜玻璃：冷调真实玻璃
  glassCold: new THREE.MeshPhysicalMaterial({
    color: 0xb8d8ff,
    transparent: true,
    opacity: 0.3,
    roughness: 0.05,
    metalness: 0.02,
    transmission: 0.9,
    ior: 1.5,
    thickness: 0.05,
    emissive: 0xaaddff,
    emissiveIntensity: 0.15
  }),
  // 积水：高反射水面
  puddle: new THREE.MeshStandardMaterial({
    color: 0x1d2d48,
    roughness: 0.02,
    metalness: 0.92,
    transparent: true,
    opacity: 0.5
  }),
  // 发光灯箱：柔和匀光
  signGlow: new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xffffff,
    emissiveIntensity: 0,
    roughness: 0.45,
    metalness: 0.1
  }),
  // 通用塑料
  plastic: new THREE.MeshStandardMaterial({
    color: 0xdfdfdf,
    roughness: 0.58,
    metalness: 0.05
  }),
  // 深色金属零件
  darkMetal: new THREE.MeshStandardMaterial({
    color: 0x383842,
    roughness: 0.38,
    metalness: 0.68
  }),
  // 木质
  wood: new THREE.MeshStandardMaterial({
    color: 0x8b6c52,
    roughness: 0.8,
    metalness: 0.02
  })
};

// ==================================================
// 3. 分层写实灯光系统（冷暖自然过渡）
// ==================================================
const ambient = new THREE.AmbientLight(0x303a58, 0.26);
scene.add(ambient);

// 冷色月光：边缘轮廓光
const moonLight = new THREE.DirectionalLight(0x8fabff, 0.24);
moonLight.position.set(-5, 9, 4);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(1024, 1024);
moonLight.shadow.camera.left = -6;
moonLight.shadow.camera.right = 6;
moonLight.shadow.camera.top = 6;
moonLight.shadow.camera.bottom = -6;
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 20;
moonLight.shadow.bias = -0.0005;
scene.add(moonLight);

// 便利店主暖光
const storeMainLight = new THREE.PointLight(0xffd29a, 0, 9, 2.1);
storeMainLight.position.set(0, 2.0, -1.4);
scene.add(storeMainLight);

// 店内补光
const storeFillLight = new THREE.PointLight(0xffe6c2, 0, 6, 2.2);
storeFillLight.position.set(-0.4, 1.4, -1.8);
scene.add(storeFillLight);

// 雨棚下筒灯（3个，真实照明）
const awningLights = [];
for (let i = 0; i < 3; i++) {
  const light = new THREE.PointLight(0xfff0c8, 0, 3, 2);
  light.position.set(-1.0 + i * 1.0, 2.32, 1.55);
  awningLights.push(light);
  scene.add(light);
}

// 冷柜内部冷光
const fridgeLight = new THREE.PointLight(0xaaddff, 0, 2.5, 2);
fridgeLight.position.set(-0.2, 1.2, -1.2);
scene.add(fridgeLight);

// 蓝色霓虹点缀
const neonBlue = new THREE.PointLight(0x6688dd, 0, 6, 1.9);
neonBlue.position.set(-1.2, 2.0, -0.3);
scene.add(neonBlue);

// 路灯光
const streetLamp = new THREE.PointLight(0xffbe6a, 0, 5.5, 2.1);
streetLamp.position.set(2.0, 2.6, 1.8);
scene.add(streetLamp);

// 小巷微光
const alleyLight = new THREE.PointLight(0xffb366, 0, 3.5, 2.3);
alleyLight.position.set(-2.8, 2.0, -2.7);
scene.add(alleyLight);

// 地面反弹光
const bounceLight = new THREE.PointLight(0x6688cc, 0, 8, 2.6);
bounceLight.position.set(0, 0.1, 1);
scene.add(bounceLight);

// ==================================================
// 4. 正方形底座
// ==================================================
const baseGroup = new THREE.Group();
scene.add(baseGroup);

const base = new THREE.Mesh(
  new THREE.BoxGeometry(8.6, 0.45, 8.6),
  new THREE.MeshStandardMaterial({ color: 0x10121e, roughness: 0.92, metalness: 0.08 })
);
base.position.y = -0.225;
base.receiveShadow = true;
baseGroup.add(base);

const baseTop = new THREE.Mesh(
  new THREE.BoxGeometry(8.5, 0.05, 8.5),
  new THREE.MeshStandardMaterial({ color: 0x191c2e, roughness: 0.78, metalness: 0.2 })
);
baseTop.position.y = 0.025;
baseGroup.add(baseTop);

const edgeMat = new THREE.MeshStandardMaterial({ color: 0x2c314a, roughness: 0.6, metalness: 0.3 });
function addEdge(x, z, rotY = 0) {
  const edge = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.1, 0.1), edgeMat);
  edge.position.set(x, 0.07, z);
  edge.rotation.y = rotY;
  baseGroup.add(edge);
  return edge;
}
const edgeN = addEdge(0, 4.25);
const edgeS = addEdge(0, -4.25);
const edgeE = addEdge(4.25, 0, Math.PI / 2);
const edgeW = addEdge(-4.25, 0, Math.PI / 2);

// ==================================================
// 5. 街道与地面系统
// ==================================================
const roadGroup = new THREE.Group();
baseGroup.add(roadGroup);
const GROUND_Y = 0.051; // 统一地面高度基准

// 主路面
const road = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 8.4), Materials.asphalt);
road.rotation.x = -Math.PI / 2;
road.position.y = GROUND_Y;
road.receiveShadow = true;
road.name = "沥青路面";
roadGroup.add(road);

// 人行道
const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 4.4), Materials.sidewalk);
sidewalk.rotation.x = -Math.PI / 2;
sidewalk.position.set(-1.7, GROUND_Y + 0.001, -0.8);
sidewalk.receiveShadow = true;
sidewalk.name = "人行道";
roadGroup.add(sidewalk);

// 路缘石
const curb = new THREE.Mesh(
  new THREE.BoxGeometry(3.4, 0.14, 0.14),
  new THREE.MeshStandardMaterial({ color: 0x525568, roughness: 0.82, metalness: 0.08 })
);
curb.position.set(-1.7, GROUND_Y + 0.07, -0.4);
curb.castShadow = true;
curb.name = "路缘石";
roadGroup.add(curb);

// 排水沟
const drain = new THREE.Mesh(
  new THREE.BoxGeometry(3.4, 0.025, 0.18),
  new THREE.MeshStandardMaterial({ color: 0x0e0e16, roughness: 0.72, metalness: 0.45 })
);
drain.position.set(-1.7, GROUND_Y + 0.0125, 0.92);
drain.name = "排水沟";
roadGroup.add(drain);

// 排水格栅
for (let i = 0; i < 15; i++) {
  const slat = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.02, 0.025),
    new THREE.MeshStandardMaterial({ color: 0x20202c, roughness: 0.62, metalness: 0.35 })
  );
  slat.position.set(-3.05 + i * 0.23, GROUND_Y + 0.01, 0.92);
  roadGroup.add(slat);
}

// 斑马线
for (let i = 0; i < 6; i++) {
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(0.17, 0.95),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.04, roughness: 0.68 })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(-2.65 + i * 0.37, GROUND_Y + 0.003, 2.35);
  roadGroup.add(line);
}
roadGroup.children[18].name = "斑马线"; // 标记第一条用于识别

// 停车位标线
for (let i = 0; i < 3; i++) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.02, 0.04),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.02, roughness: 0.58 })
  );
  line.position.set(2.45, GROUND_Y + 0.01, -2.2 + i * 1.35);
  roadGroup.add(line);
}

// 积水区域
function makePuddle(x, z, r, op = 0.45) {
  const p = new THREE.Mesh(new THREE.CircleGeometry(r, 64), Materials.puddle.clone());
  p.rotation.x = -Math.PI / 2;
  p.position.set(x, GROUND_Y + 0.002, z);
  p.material.opacity = op;
  p.name = "地面积水";
  roadGroup.add(p);
  return p;
}
const puddle1 = makePuddle(1.7, 1.65, 1.1, 0.5);
const puddle2 = makePuddle(1.2, 1.0, 0.7, 0.42);
const puddle3 = makePuddle(-1.7, -1.2, 0.75, 0.4);

// 光源反射
function makeReflection(x, z, w, h, color, op = 0.18) {
  const r = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  r.rotation.x = -Math.PI / 2;
  r.position.set(x, GROUND_Y + 0.004, z);
  roadGroup.add(r);
  return r;
}
const reflLamp = makeReflection(1.7, 1.65, 0.9, 0.2, 0xffbe6a, 0.2);
const reflStore = makeReflection(1.2, 1.0, 1.1, 0.25, 0xffd29a, 0.18);
const reflNeon = makeReflection(-1.2, 0.5, 0.6, 0.15, 0x6688dd, 0.16);

// 街角护栏
const railGroup = new THREE.Group();
const railMat = new THREE.MeshStandardMaterial({ color: 0x6d7593, roughness: 0.65, metalness: 0.25 });
for (let i = 0; i < 4; i++) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.62, 16), railMat);
  post.position.set(0.06 + i * 0.36, GROUND_Y + 0.31, -2.05);
  railGroup.add(post);
}
const railTop = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.05, 0.05), railMat);
railTop.position.set(0.6, GROUND_Y + 0.57, -2.05);
railGroup.add(railTop);
railGroup.name = "街角护栏";
roadGroup.add(railGroup);

// 小巷入口
const alleyGroup = new THREE.Group();
const alleyWall = new THREE.Mesh(
  new THREE.BoxGeometry(0.12, 2.5, 1.7),
  new THREE.MeshStandardMaterial({ color: 0x4a4c5e, roughness: 0.85, metalness: 0.06 })
);
alleyWall.position.set(-3.45, GROUND_Y + 1.25, -2.45);
alleyWall.castShadow = true;
alleyGroup.add(alleyWall);

const alleyBack = new THREE.Mesh(
  new THREE.BoxGeometry(1.7, 2.5, 0.12),
  new THREE.MeshStandardMaterial({ color: 0x202234, roughness: 0.92, metalness: 0.02 })
);
alleyBack.position.set(-2.65, GROUND_Y + 1.25, -3.25);
alleyGroup.add(alleyBack);
alleyGroup.name = "小巷入口";
roadGroup.add(alleyGroup);

// ==================================================
// 6. 便利店主体（深化写实结构，细节丰富）
// ==================================================
const storeGroup = new THREE.Group();
storeGroup.position.set(0, 0, -1.5);
scene.add(storeGroup);

// --- 墙体结构（带腰线、分格，非单调白墙）---
const wallMat = Materials.wall;
const trimMat = Materials.wallTrim;

// 后墙
const backWall = new THREE.Mesh(new THREE.BoxGeometry(3.3, 2.65, 0.1), wallMat);
backWall.position.set(0, 1.325, -1.15);
backWall.castShadow = true;
backWall.receiveShadow = true;
backWall.name = "便利店外墙";
storeGroup.add(backWall);

// 后墙腰线
const backTrim = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.06, 0.11), trimMat);
backTrim.position.set(0, 1.8, -1.15);
storeGroup.add(backTrim);

// 左墙
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.65, 2.3), wallMat);
leftWall.position.set(-1.65, 1.325, 0);
leftWall.castShadow = true;
leftWall.receiveShadow = true;
storeGroup.add(leftWall);

// 右墙
const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.65, 2.3), wallMat);
rightWall.position.set(1.65, 1.325, 0);
rightWall.castShadow = true;
rightWall.receiveShadow = true;
storeGroup.add(rightWall);

// 天花板
const ceiling = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.1, 2.3), wallMat);
ceiling.position.set(0, 2.6, 0);
ceiling.receiveShadow = true;
storeGroup.add(ceiling);

// 侧墙招牌
const sideSign = new THREE.Mesh(
  new THREE.BoxGeometry(0.12, 0.75, 0.95),
  new THREE.MeshStandardMaterial({ color: 0x253555, emissive: 0x4477dd, emissiveIntensity: 0, roughness: 0.55 })
);
sideSign.position.set(1.71, 1.6, -0.6);
sideSign.name = "侧墙招牌";
storeGroup.add(sideSign);

// 屋顶
const roof = new THREE.Mesh(new THREE.BoxGeometry(3.7, 0.2, 2.8), Materials.buildingDark);
roof.position.y = 2.75;
roof.castShadow = true;
storeGroup.add(roof);

// 雨棚（带支撑结构）
const awning = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.14, 0.75), Materials.buildingDark);
awning.position.set(0, 2.46, 1.38);
awning.castShadow = true;
awning.name = "便利店雨棚";
storeGroup.add(awning);

// 雨棚支撑柱
for (let i = 0; i < 2; i++) {
  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.03, 0.5, 12),
    Materials.metalFrame
  );
  pillar.position.set(-1.4 + i * 2.8, 2.21, 1.65);
  storeGroup.add(pillar);
}

// 雨棚下筒灯模型
for (let i = 0; i < 3; i++) {
  const downlight = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.07, 0.03, 16),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff0c8, emissiveIntensity: 0 })
  );
  downlight.position.set(-1.0 + i * 1.0, 2.38, 1.6);
  downlight.name = "雨棚筒灯";
  storeGroup.add(downlight);
}

// 主招牌（灯箱结构，带边框）
const signFrame = new THREE.Mesh(
  new THREE.BoxGeometry(3.5, 0.68, 0.18),
  Materials.darkMetal
);
signFrame.position.set(0, 2.18, 1.2);
storeGroup.add(signFrame);

const signBoard = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.58, 0.14), Materials.signGlow);
signBoard.position.set(0, 2.18, 1.23);
signBoard.name = "便利店招牌";
storeGroup.add(signBoard);

// 招牌品牌色块
const signRed = new THREE.Mesh(
  new THREE.BoxGeometry(0.95, 0.38, 0.08),
  new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xee3344, emissiveIntensity: 0, roughness: 0.35 })
);
signRed.position.set(-1.0, 2.18, 1.28);
storeGroup.add(signRed);

const signBlue = new THREE.Mesh(
  new THREE.BoxGeometry(0.95, 0.38, 0.08),
  new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x3366dd, emissiveIntensity: 0, roughness: 0.35 })
);
signBlue.position.set(1.0, 2.18, 1.28);
storeGroup.add(signBlue);

// --- 正面橱窗（双格细分窗框）---
const winTop = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.11, 0.07), Materials.metalFrame);
const winBot = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.11, 0.07), Materials.metalFrame);
const winMid = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.22, 0.07), Materials.metalFrame);
// 增加竖向分格
const winV1 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.22, 0.07), Materials.metalFrame);
const winV2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.22, 0.07), Materials.metalFrame);

winTop.position.set(0, 1.88, 1.18);
winBot.position.set(0, 0.54, 1.18);
winMid.position.set(0, 1.21, 1.18);
winV1.position.set(-1.0, 1.21, 1.18);
winV2.position.set(1.0, 1.21, 1.18);
storeGroup.add(winTop, winBot, winMid, winV1, winV2);

// 四块橱窗玻璃
const glass1 = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.12), Materials.glass);
const glass2 = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.12), Materials.glass);
const glass3 = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.12), Materials.glass);
const glass4 = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.12), Materials.glass);
glass1.position.set(-1.3, 1.21, 1.182);
glass2.position.set(-0.45, 1.21, 1.182);
glass3.position.set(0.45, 1.21, 1.182);
glass4.position.set(1.3, 1.21, 1.182);
glass1.name = "便利店橱窗";

// 9. 组装入场动画（平滑有序，由下至上）
// ==================================================
const tracks = [];

function trackMesh(mesh, delay, duration, startY = -4.0) {
  mesh.userData._baseY = mesh.position.y;
  mesh.position.y = startY;
  mesh.scale.setScalar(0.01);
  mesh.visible = false;
  tracks.push({ type: 'mesh', mesh, delay, duration, startY, phase: 0 });
}

function trackLight(light, delay, duration, from, to) {
  light.intensity = from;
  tracks.push({ type: 'light', light, delay, duration, from, to, phase: 0 });
}

function trackValue(delay, duration, from, to, callback) {
  tracks.push({ type: 'value', delay, duration, from, to, callback, phase: 0 });
}

// 11. 主渲染循环
// ==================================================
const clock = new THREE.Clock();
const startTime = clock.getElapsedTime() + 0.3;

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function animate() {
  requestAnimationFrame(animate);
  const now = clock.getElapsedTime();
  const t = now - startTime;

  controls.update();

  // 播放组装动画
  tracks.forEach(track => {
    if (t < track.delay) return;
    if (track.phase === 0) {
      if (track.type === 'mesh') track.mesh.visible = true;
      track.phase = 1;
    }
    if (track.phase === 1) {
      const p = Math.min((t - track.delay) / track.duration, 1);
      const e = easeOutCubic(p);
      if (track.type === 'mesh') {
        track.mesh.position.y = track.startY + (track.mesh.userData._baseY - track.startY) * e;
        track.mesh.scale.setScalar(0.01 + (1 - 0.01) * e);
      } else if (track.type === 'light') {
        track.light.intensity = track.from + (track.to - track.from) * e;
      } else if (track.type === 'value') {
        track.callback(track.from + (track.to - track.from) * e);
      }
      if (p >= 1) track.phase = 2;
    }
  });

  // 雨滴下落
  const pos = rain.geometry.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    pos[i * 3 + 1] -= rainVel[i];
    if (pos[i * 3 + 1] < -1) pos[i * 3 + 1] = 7;
  }
  rain.geometry.attributes.position.needsUpdate = true;

  // 霓虹轻微呼吸
  neonBlue.intensity += Math.sin(now * 2.0) * 0.035;

  // 积水波纹
  puddle1.material.opacity = 0.42 + Math.sin(now * 2.4) * 0.05;
  puddle2.material.opacity = 0.38 + Math.sin(now * 1.9 + 0.5) * 0.04;
  puddle3.material.opacity = 0.35 + Math.sin(now * 2.2 + 1) * 0.03;

  // 反射微动
  reflLamp.material.opacity = 0.18 + Math.sin(now * 1.7) * 0.03;
  reflStore.material.opacity = 0.16 + Math.sin(now * 1.5 + 0.3) * 0.03;

  // 空调风扇转动
  acFan.rotation.z = now * 2;

  // 射线检测悬停物体
  raycaster.setFromCamera(mouse, camera);
  const meshes = interactables.map(i => i.obj);
  const hits = raycaster.intersectObjects(meshes, true);

  if (hits.length > 0) {
    const hit = hits[0].object;
    const item = interactables.find(x => 
      x.obj === hit || hit.parent === x.obj || hit.parent?.parent === x.obj || hit.parent?.parent?.parent === x.obj
    );
    if (item && hoverTarget !== item) {
      if (hoverTarget) hoverTarget.obj.scale.setScalar(1);
      hoverTarget = item;
      document.body.style.cursor = 'pointer';
      // 显示提示
      tooltip.textContent = item.name;
      tooltip.style.opacity = 1;
    }
  } else if (hoverTarget) {
    hoverTarget.obj.scale.setScalar(1);
    hoverTarget = null;
    document.body.style.cursor = 'grab';
    // 隐藏提示
    tooltip.style.opacity = 0;
  }

  if (hoverTarget) {
    hoverTarget.obj.scale.setScalar(1.035);
  }

  composer.render();
}

});
